
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo kursora</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    cursor: none;
  }

  iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }

  /* Przezroczysta warstwa nad całą stroną */
  #mouseLayer {
    position: fixed;
    inset: 0;
    z-index: 999998;
    background: transparent;
    cursor: none;
  }

  #fakeCursor {
    position: fixed;
    left: 0;
    top: 0;
    z-index: 999999;
    pointer-events: none;
    font: 28px/1 sans-serif;
    user-select: none;
  }
</style>
</head>
<body>

<iframe src="http://127.0.0.1:8000/" title="Moje notatki"></iframe>

<div id="mouseLayer"></div>
<div id="fakeCursor" aria-hidden="true">🖊</div>

<script>
  const layer = document.getElementById("mouseLayer");
  const cursor = document.getElementById("fakeCursor");

  layer.addEventListener("mousemove", event => {
    cursor.style.left = (event.clientX - 800) + "px";
    cursor.style.top = event.clientY + "px";
  });
</script>

</body>
</html>

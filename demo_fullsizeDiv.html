
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moje notatki</title>
    <style>

        html, body {
            margin: 0;
            padding: 0;         /* zeruje zewn. i wewn. marginesy */
            width: 100%;
            height: 100%;       /* ustawia szer. i wys. na 100% */
            overflow: hidden;   /* usuwa paski przewijania */
        }

        .fullscreen-iframe {
            width: 100%;
            height: 100%;
            border: none;       /* usuwa obramowanie iframe */
            display: block;     /* element zaczyna się od nowego wiersza
                                   i zajmuje całą dostępną przestrzeń */
        }

        .fullsize-div {
            position: fixed;
            width: 100vw;
            height: 100vh;
            background-color: rgb(0, 0, 255);
            opacity: 0;           /* ustawienia przezroczystości w celach demonstracji */
            z-index: 100;         /* ustawia warstwę na samym wierzchu */
        }

    </style>
</head>

<body>

    <div class="fullsize-div" id="clickDiv"></div>
    <iframe src="http://127.0.0.1:2000/notesite.html" class="fullscreen-iframe" title="Moje notatki"></iframe>
    
    <script>
        const overlay = document.getElementById('clickDiv');
        overlay.addEventListener('click', function() {alert('Przechwycono kliknięcie w div!');});
    </script>
    
</body>
</html>
